name: Lean proof verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Lean and mathlib; build and audit every module
        run: bash scripts/setup.sh
      - name: Check rejection of invalid proofs, placeholders and extra axioms
        run: python3 scripts/test_verification.py
      - name: Rebuild clean local proof objects and record the final axiom audit
        run: python3 scripts/verify.py --clean-local
